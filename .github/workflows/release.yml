name: Linux binary release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14.4'
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install Python dependencies
        run: |
          python -m pip install -r requirements-dev.lock
          python -m pip install --no-deps -e .
      - name: Validate source
        run: |
          ruff check .
          ruff format --check .
          mypy --strict src/
          pytest
      - name: Validate version and release tag
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path
          from mntui import __version__

          version = tomllib.loads(Path('pyproject.toml').read_text())['project']['version']
          assert version == __version__, 'Package and project versions must match'
          if os.environ['REF_TYPE'] == 'tag':
              assert os.environ['REF_NAME'] == f'v{version}', 'Tag must match project version'
          PY

  build:
    needs: validate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14.4'
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential ccache patchelf
          python -m pip install -r requirements-dev.lock
          python -m pip install --no-deps -e .
      - name: Compile standalone payload and onefile executable
        env:
          NUITKA_CACHE_DIR: ${{ runner.temp }}/nuitka-cache
        run: |
          python -m nuitka --mode=onefile --include-package=mntui \
            --nofollow-import-to=mypy,pytest,pydantic.mypy,pygments \
            --output-dir=build/onefile --output-filename=mntui --jobs=2 \
            src/mntui/__main__.py
      - name: Smoke-test both executables
        run: |
          python - <<'PY'
          import os
          import subprocess
          from pathlib import Path

          for binary in ('build/onefile/mntui', 'build/onefile/__main__.dist/mntui'):
              executable = str(Path(binary).resolve())
              for arguments, missing, expected in (
                  (['--version'], True, 0),
                  (['--check'], False, 0),
                  (['--check'], True, 2),
              ):
                  env = dict(os.environ)
                  if missing:
                      env['PATH'] = '/nonexistent-mntui-commands'
                  result = subprocess.run(
                      [executable, *arguments], env=env, capture_output=True,
                      text=True, timeout=30,
                  )
                  print(binary, arguments, result.stdout, result.stderr)
                  assert result.returncode == expected, result.returncode
          PY
      - name: Package release assets
        run: |
          mkdir -p dist/package/mntui-linux-x86_64-standalone
          cp -a build/onefile/__main__.dist/. dist/package/mntui-linux-x86_64-standalone/
          cp LICENSE README.md dist/package/mntui-linux-x86_64-standalone/
          tar -C dist/package -czf dist/mntui-linux-x86_64-standalone.tar.gz mntui-linux-x86_64-standalone
          install -m 755 build/onefile/mntui dist/mntui-linux-x86_64
          cp LICENSE dist/LICENSE
          cd dist
          sha256sum mntui-linux-x86_64 mntui-linux-x86_64-standalone.tar.gz LICENSE > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: mntui-linux-x86_64
          path: |
            dist/mntui-linux-x86_64
            dist/mntui-linux-x86_64-standalone.tar.gz
            dist/LICENSE
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: mntui-linux-x86_64
          path: dist
      - name: Verify assets and publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd dist
          sha256sum --check SHA256SUMS
          gh release create "$RELEASE_TAG" \
            mntui-linux-x86_64 mntui-linux-x86_64-standalone.tar.gz LICENSE SHA256SUMS \
            --verify-tag --draft --generate-notes --title "mntui $RELEASE_TAG"
          gh release edit "$RELEASE_TAG" --draft=false
