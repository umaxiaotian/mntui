[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mntui"
version = "0.1.0"
description = "A simple TUI for managing disks, filesystems, and mounts on Linux."
requires-python = ">=3.12"
dependencies = ["pydantic>=2.10,<3", "prompt_toolkit>=3.0.48,<4"]
license = "MIT"
readme = "README.md"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.11", "mypy>=1.15", "Nuitka>=2.7", "ordered-set>=4", "zstandard>=0.23"]

[project.scripts]
mntui = "mntui.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["destructive: explicit opt-in loop-device tests"]
